name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Show lint findings
        if: always()
        working-directory: android
        run: cat app/build/reports/lint-results-debug.txt || echo "aucun rapport texte"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myhitbodedut-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publie l'APK dans une release au nom fixe « latest », ce qui donne un
      # lien de téléchargement direct et stable, au lieu du zip d'artefact.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyHitbodedut-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyHitbodedut-debug.apk \
            --title "MyHitbodedut - build de developpement" \
            --notes "APK de debogage construit depuis le commit ${{ github.sha }}." \
            --latest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
