name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      # Les illustrations ont ete taillees dans des planches qui en
      # contenaient plusieurs. Deux avaient garde un bout du voisin, et
      # personne ne l'a vu avant de regarder l'application sur un telephone.
      - name: Check the illustrations
        run: |
          python3 -m pip install --quiet pillow numpy scipy
          python3 tools/verifie_illustrations.py

      - name: Build both signed editions
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleFullRelease assembleLightRelease

      # L'edition de test porte l'ecran de relecture, seul moyen de lever les
      # relu=false de chizuk.json depuis le telephone. Identifiant suffixe en
      # .debug : elle s'installe a cote de l'edition normale.
      - name: Build the test edition
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleFullDebug

      # R8 est actif en release : la taille est la raison de l'avoir active,
      # donc elle est affichee a chaque construction.
      - name: Show APK sizes
        working-directory: android
        run: |
          for f in app/build/outputs/apk/*/*/*.apk; do
            printf '%8s  %s\n' "$(du -h "$f" | cut -f1)" "$f"
          done

      - name: Unit tests
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testFullDebugUnitTest

      - name: Lint
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon lintFullRelease

      - name: Show lint findings
        if: always()
        working-directory: android
        run: cat app/build/reports/lint-results-debug.txt || echo "aucun rapport texte"

      # Copie de commodite : la livraison passe par la release ci-dessous.
      # Le 28/09 le quota de stockage des artefacts etait plein (3 APK de
      # ~130 Mo par construction, gardes 90 jours) ; cet envoi echouait et
      # empechait la release de partir, alors que tout le reste avait reussi.
      # Il ne bloque donc plus rien, et ne garde ses fichiers que deux jours.
      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: myhitbodedut-apk
          path: android/app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error
          retention-days: 2

      # Publie l'APK dans une release au nom fixe « latest », ce qui donne un
      # lien de téléchargement direct et stable, au lieu du zip d'artefact.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk MyHitbodedut.apk
          cp app/build/outputs/apk/light/release/app-light-release.apk MyHitbodedut-Light.apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk MyHitbodedut-Relecture.apk
          # Sans cette table, une trace d'execution de la release est
          # illisible : R8 a renomme les classes.
          cp app/build/outputs/mapping/fullRelease/mapping.txt mapping-full.txt
          # Nettoyage unique de l'ancienne etiquette fixe, sans effet ensuite.
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v1.${{ github.run_number }}" \
            MyHitbodedut.apk MyHitbodedut-Light.apk MyHitbodedut-Relecture.apk \
            mapping-full.txt \
            --title "MyHitbodedut 1.${{ github.run_number }}" \
            --notes "Trois editions signees, construites depuis le commit ${{ github.sha }}. Light n'embarque pas la barriere du matin ni ses permissions. Relecture est l'edition de test : elle s'installe a cote des autres et porte l'ecran de relecture des textes." \
            --latest

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
