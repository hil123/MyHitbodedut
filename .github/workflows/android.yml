name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      captures:
        description: "Captures d'ecran sur emulateur (job captures) au lieu de la construction"
        type: boolean
        default: false
      tailles_seules:
        description: "Avec captures : seulement le passage des six tailles d'ecran"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Une demande de captures ne reconstruit pas les releases.
    if: github.event_name != 'workflow_dispatch' || !inputs.captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      # Les illustrations ont ete taillees dans des planches qui en
      # contenaient plusieurs. Deux avaient garde un bout du voisin, et
      # personne ne l'a vu avant de regarder l'application sur un telephone.
      - name: Check the illustrations
        run: |
          python3 -m pip install --quiet pillow numpy scipy
          python3 tools/verifie_illustrations.py

      - name: Build both signed editions
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleFullRelease assembleLightRelease

      # L'edition Relecture (test, identifiant .debug) n'est plus construite
      # ni publiee : le proprietaire l'a retiree le 28/09. Le type de
      # construction debug reste, l'edition d'essai (apk-essai.yml) s'en sert.

      # R8 est actif en release : la taille est la raison de l'avoir active,
      # donc elle est affichee a chaque construction.
      - name: Show APK sizes
        working-directory: android
        run: |
          for f in app/build/outputs/apk/*/*/*.apk; do
            printf '%8s  %s\n' "$(du -h "$f" | cut -f1)" "$f"
          done

      - name: Unit tests
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testFullDebugUnitTest

      - name: Lint
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon lintFullRelease

      - name: Show lint findings
        if: always()
        working-directory: android
        run: cat app/build/reports/lint-results-debug.txt || echo "aucun rapport texte"

      # Plus de copie des APK en artefact (retiree le 28/09, demande du
      # proprietaire) : deux a trois APK d'environ 130 Mo par construction
      # remplissaient a eux seuls le quota de 500 Mo d'artefacts du compte,
      # et bloquaient les autres flux. La livraison passe par la release
      # ci-dessous, qui ne compte pas dans ce quota.

      # Publie l'APK dans une release au nom fixe « latest », ce qui donne un
      # lien de téléchargement direct et stable, au lieu du zip d'artefact.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk MyHitbodedut.apk
          cp app/build/outputs/apk/light/release/app-light-release.apk MyHitbodedut-Light.apk
          # Sans cette table, une trace d'execution de la release est
          # illisible : R8 a renomme les classes.
          cp app/build/outputs/mapping/fullRelease/mapping.txt mapping-full.txt
          # Nettoyage unique de l'ancienne etiquette fixe, sans effet ensuite.
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v1.${{ github.run_number }}" \
            MyHitbodedut.apk MyHitbodedut-Light.apk \
            mapping-full.txt \
            --title "MyHitbodedut 1.${{ github.run_number }}" \
            --notes "Deux editions signees, construites depuis le commit ${{ github.sha }}. Light n'embarque pas la barriere du matin ni ses permissions." \
            --latest

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Captures d'ecran reelles, sur un emulateur, pour montrer les changements
  # au proprietaire. Seulement sur demande (workflow_dispatch, captures=true) :
  # les envois et les PR n'en sont pas ralentis. Le parcours est dans
  # .github/captures/ ; il ne fait jamais echouer le job.
  captures:
    if: github.event_name == 'workflow_dispatch' && inputs.captures
    runs-on: ubuntu-latest
    # Le passage des six tailles (20) prend a lui seul pres d'une heure.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # L'emulateur veut plus de 7 Go pour ses donnees ; le runner n'en
      # laissait que 6 (« Not enough space to create userdata partition »).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build the debug edition
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleFullDebug

      - name: Capture the screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURES_TAILLES_SEULES: ${{ inputs.tailles_seules && '1' || '0' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/captures/captures.sh

      # Apercus reduits, en base64 dans le journal : on peut les relire la
      # ou le telechargement de l'artefact n'est pas possible.
      - name: Print small previews in the log
        if: always()
        run: |
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY'
          import base64, glob, io, os
          try:
              from PIL import Image
          except ImportError:
              raise SystemExit("pas de Pillow")
          for f in sorted(glob.glob("out/*.png")):
              try:
                  im = Image.open(f).convert("RGB")
                  im.thumbnail((432, 1000))
                  buf = io.BytesIO()
                  im.save(buf, "JPEG", quality=70)
                  b = base64.b64encode(buf.getvalue()).decode()
                  print("@@APERCU " + os.path.basename(f))
                  for i in range(0, len(b), 3000):
                      print("@@B64 " + b[i:i + 3000])
                  print("@@FIN")
              except Exception as e:
                  print("@@ERREUR", f, e)
          PY

      # Les captures aussi sur une branche à part (claude/captures-android) :
      # lisibles avec git là où l'artefact ne se télécharge pas.
      - name: Publish the captures to a branch
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls out/*.png >/dev/null 2>&1 || exit 0
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp out/*.png /tmp/pub/
          cd /tmp/pub
          git init -q && git checkout -q -b claude/captures-android
          git add ./*.png ./*.txt 2>/dev/null || git add ./*.png
          git -c user.name="captures" -c user.email="actions@github.com" commit -q -m "Captures ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" claude/captures-android

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-android
          path: out/*.png
          retention-days: 14
          if-no-files-found: warn
