name: APK d'essai léger

# Le dépôt est privé : un lien de release renvoie 404 à un téléphone qui
# n'est pas connecté à GitHub. Cette construction produit une édition d'essai
# assez légère pour être transmise directement, en remplaçant les 123 Mo de
# musique par du silence. Même application, mêmes écrans, même code — seuls
# les morceaux sont muets. Elle ne sert pas à écouter mais à éprouver.
#
# Identifiant propre (ESSAI_LEGER=true, voir build.gradle.kts) : elle portait
# le même que Relecture, et Relecture est reconstruite à chaque envoi sur
# main pendant que celle-ci ne l'est qu'à la demande. Son propre versionCode
# restait donc presque toujours en retard, et Android refuse d'installer un
# versionCode plus bas que celui déjà en place — en silence ou avec une
# erreur qui passe facilement inaperçue. Aucune édition d'essai envoyée
# avant ce correctif n'a donc pu s'installer par-dessus une Relecture plus
# récente : le bouton « introuvable » signalé ensuite était celui d'une
# version qui n'avait jamais changé sur le téléphone.
#
# Déclenchement manuel uniquement.
on:
  workflow_dispatch:

# Sans cela le jeton est en lecture seule et la publication est refusée.
permissions:
  contents: write

jobs:
  leger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      # Une seconde de silence à la place de chaque morceau. Les noms de
      # fichiers ne bougent pas, donc aucun R.raw ne disparaît et le code
      # compile sans être touché.
      #
      # Sans ffmpeg : le runner ne l'a pas, la première tentative est morte
      # sur « ffmpeg: command not found ». tools/silence_mp3.py écrit les
      # trames à la main, ce qui se vérifie hors du runner.
      - name: Replace the music with silence
        run: |
          set -e
          avant=$(du -sh android/app/src/main/res/raw | cut -f1)
          python3 tools/silence_mp3.py /tmp/silence.mp3 1
          for f in android/app/src/main/res/raw/*.mp3; do
            cp /tmp/silence.mp3 "$f"
          done
          apres=$(du -sh android/app/src/main/res/raw | cut -f1)
          echo "res/raw : $avant -> $apres pour $(ls android/app/src/main/res/raw/*.mp3 | wc -l) morceaux"

      - name: Build the test edition
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ESSAI_LEGER: "true"
        run: ./gradlew --no-daemon assembleFullDebug

      - name: Show its size
        working-directory: android
        run: du -h app/build/outputs/apk/full/debug/app-full-debug.apk

      # Publié dans une release plutôt qu'en artefact : le téléchargement
      # d'un artefact redirige vers le stockage Azure, que tout le monde ne
      # peut pas atteindre — la release, elle, passe par github.com.
      # Étiquette fixe « essai », remplacée à chaque fois, et jamais marquée
      # « latest » pour ne pas déplacer la version en cours.
      - name: Publish it under a fixed tag
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk MyHitbodedut-essai.apk
          gh release delete essai --yes --cleanup-tag || true
          gh release create essai MyHitbodedut-essai.apk \
            --title "Édition d'essai, sans la musique" \
            --notes "Même application que la dernière version, mais les 33 morceaux sont remplacés par une seconde de silence, ce qui ramène l'APK de 125 Mo a une douzaine. Identifiant propre (com.myhitbodedut.debug.essai) : elle s'installe a cote de tout le reste et ne remplace rien. Construite depuis ${{ github.sha }}." \
            --prerelease
