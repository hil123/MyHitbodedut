name: Web (iPhone)

# La version web installable, construite depuis les ressources Android.
# Elle ne touche pas à l'application Android ni à ses versions : ce flux a
# sa propre construction, ses propres tests, et sa propre mise en ligne.

on:
  push:
    branches: [main, claude/version-web]
    paths:
      - 'web/**'
      - 'android/app/src/main/res/**'
      - 'android/app/src/main/java/com/myhitbodedut/MusicLibrary.kt'
      - 'android/app/src/main/java/com/myhitbodedut/Zmanim.kt'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'android/app/src/main/res/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  # Écriture : pour la branche des captures seulement.
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Hebcal, moteur de comparaison des tests du calendrier : dépendance de
      # test seulement (licence GPL), jamais copiée dans le site construit.
      - name: Test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Unit tests (rules ported from Android)
        working-directory: web
        run: node --test test/*.test.mjs

      - name: Build
        working-directory: web
        run: node build.mjs

      # Les textes hébreux et leurs traductions ont été vérifiés un par un :
      # le site doit servir exactement les mêmes octets.
      - name: Verified texts are served unchanged
        run: |
          for f in chizuk.json bibliotheque.json tikkun_haklali.json villes.json siddur_annotations.json; do
            cmp "android/app/src/main/res/raw/$f" "web/dist/data/$f"
          done

      - name: Install browsers
        working-directory: web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      # WebKit est le moteur de Safari : c'est lui qui compte pour l'iPhone.
      - name: Screenshots and checks (WebKit, Chromium)
        working-directory: web
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright
        run: |
          node test/captures.mjs webkit captures
          node test/captures.mjs chromium captures
          # Le plus petit téléphone courant (320×568) : rien ne déborde, « Commencer » se voit (15/10).
          LARGEUR=320 node test/captures.mjs chromium captures/petit

      # Chaque écran à chaque taille, du petit téléphone à l'ordinateur :
      # aucun débordement, et les onglets en bas ou sur le côté selon la largeur.
      # WebKit pour Safari (iPhone, iPad), Chromium pour Android et l'ordinateur.
      - name: Every screen at every size (WebKit, Chromium)
        working-directory: web
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright
        run: |
          node test/tailles.mjs webkit captures/tailles
          node test/tailles.mjs chromium captures/tailles

      # Le quota d'artefacts du compte est plein (voir android.yml) : les
      # captures partent sur une branche à part, remplacée à chaque fois.
      - name: Publish screenshots to the captures branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d web/captures ] || exit 0
          cd web/captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures linux du commit ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" captures:claude/captures-linux

      # La mise en ligne pousse le site construit dans un dépôt public qui ne
      # contient que lui, servi par GitHub Pages. Le code Android reste privé.
      # Sans le jeton WEB_DEPLOY_TOKEN (secret du dépôt), l'étape ne fait rien.
      - name: Deploy to the public site repository
        # Seule main met en ligne : une poussée sur une vieille branche de travail écraserait le site.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          CIBLE: hil123/myhitbodedut-web
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Pas de secret WEB_DEPLOY_TOKEN : site construit et testé, non mis en ligne."
            exit 0
          fi
          cd web/dist
          # Pages servirait sinon ses propres règles Jekyll.
          touch .nojekyll
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          # Un seul commit, remplacé à chaque fois : ~130 Mo de musique ne
          # s'empilent pas d'une version à l'autre dans l'historique.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${CIBLE}.git" main
          echo "En ligne : https://hil123.github.io/myhitbodedut-web/ (version $(cat version.txt))"
