# Les morceaux de Noam Shpayer (נעם שפייר), autorisés par l'artiste (déclaration du
# propriétaire, 19/10), lus sur son compte SoundCloud officiel (soundcloud.com/nmshpyyr)
# et poussés sur la branche claude/source-noam. Aucune vérification n'est contournée.
name: Source Noam Shpayer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-24.04
    steps:
      - name: Télécharger depuis SoundCloud
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q yt-dlp
          mkdir -p source/mp3 && cd source
          yt-dlp --flat-playlist --print "%(id)s\t%(title)s\t%(duration)s" "https://soundcloud.com/nmshpyyr/tracks" | tee liste.tsv || true
          yt-dlp -x --audio-format mp3 --audio-quality 0 -o "mp3/%(title)s.%(ext)s" --write-info-json --no-progress \
            "https://soundcloud.com/nmshpyyr/tracks" 2>&1 | tail -40 || true
          ls -la mp3 | head -60; du -sh .
      - name: Pousser sur claude/source-noam
        run: |
          cd source
          git init -q -b claude/source-noam
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "source: Noam Shpayer (SoundCloud officiel)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/source-noam
