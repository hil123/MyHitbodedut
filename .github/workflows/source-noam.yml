# Les morceaux de Noam Shpayer (נעם שפייר), autorisés par l'artiste (déclaration du
# propriétaire, 19/10), lus sur sa chaîne YouTube officielle et poussés en MP3 sur la
# branche claude/source-noam. Si YouTube demande une vérification, on s'arrête.
name: Source Noam Shpayer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-24.04
    steps:
      - name: Télécharger l'audio de la chaîne
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q yt-dlp
          mkdir -p source/mp3 && cd source
          yt-dlp --flat-playlist --print "%(id)s\t%(title)s\t%(duration)s" "https://www.youtube.com/@-noamshpayer8004/videos" | tee liste.tsv || true
          yt-dlp -x --audio-format mp3 --audio-quality 128K --match-filter "duration < 600" \
            -o "mp3/%(id)s.%(ext)s" --write-info-json --no-progress \
            "https://www.youtube.com/@-noamshpayer8004/videos" 2>&1 | tail -40 || true
          ls -la mp3 | head -60; du -sh .
      - name: Pousser sur claude/source-noam
        run: |
          cd source
          git init -q -b claude/source-noam
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "source: Noam Shpayer (chaîne YouTube officielle)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/source-noam
