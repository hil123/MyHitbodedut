# Le projet Xcode est généré par XcodeGen (`xcodegen generate` dans ios/) :
# seul ce fichier est versionné, pas le .xcodeproj, que personne n'édite à la main.
name: MyHitbodedut
options:
  bundleIdPrefix: com.myhitbodedut
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyHitbodedut:
    type: application
    platform: iOS
    sources:
      - path: MyHitbodedut
        excludes:
          - "Genere/**"
      # Construit par tools/prepare.sh : référence de dossier, copiée telle quelle.
      - path: MyHitbodedut/Genere
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MyHitbodedut
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, he]
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhitbodedut
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  MyHitbodedutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyHitbodedutTests
      - path: ../web/test/vecteurs_kosherjava.json
        buildPhase: resources
    dependencies:
      - target: MyHitbodedut
schemes:
  MyHitbodedut:
    build:
      targets:
        MyHitbodedut: all
        MyHitbodedutTests: [test]
    test:
      targets: [MyHitbodedutTests]
